# ─── defdo_ddns CI + Hex publish ─────────────────────────────────────────────
#
# Migrated from GitHub Actions: that account's billing is blocked, so every job
# died in seconds without running a step and nothing could ship.
#
# Secrets: hex_api_key

# Tier 1: real container images on the k8s docker agent. Without this label
# Woodpecker sends the workflow to whichever agent is free, and the local exec
# agent execs the image name as a host binary.
labels:
  platform: linux/amd64

when:
  - event: [push, pull_request]
    branch: main
  - event: tag
  - event: manual

steps:
  - name: format-and-compile
    image: elixir:1.19.5
    when:
      event: [push, pull_request, manual]
    commands:
      - mix do local.hex --force, local.rebar --force
      - mix deps.get
      - mix format --check-formatted
      - mix deps.unlock --check-unused
      - mix compile --warnings-as-errors

  - name: test
    image: elixir:1.19.5
    when:
      event: [push, pull_request, manual]
    commands:
      - mix do local.hex --force, local.rebar --force
      - mix deps.get
      - mix compile --warnings-as-errors
      - mix test

  - name: release-validate
    image: elixir:1.19.5
    when:
      event: tag
    commands:
      - mix do local.hex --force, local.rebar --force
      - mix deps.get
      - mix format --check-formatted
      - mix deps.unlock --check-unused
      - mix compile --warnings-as-errors
      - mix test
      - mix hex.build

  - name: hex-publish
    image: elixir:1.19.5
    when:
      event: tag
    depends_on: [release-validate]
    environment:
      HEX_API_KEY:
        from_secret: hex_api_key
    commands:
      - |
        if [ -z "$$HEX_API_KEY" ]; then
          echo "ERROR: HEX_API_KEY is required to publish"
          exit 1
        fi
      - mix do local.hex --force, local.rebar --force
      - mix deps.get
        # Package and docs are published SEPARATELY on purpose. `mix hex.publish`
        # does both at once, and when its docs phase re-submits the release Hex
        # answers `must include the --replace flag to update an existing release`:
        # the package is live and the step still goes red. A red that does not mean
        # "not published" is worse than no signal — the next person reaches for
        # --replace and overwrites a published version.
      - mix hex.publish package --yes
      - mix hex.publish docs --yes
